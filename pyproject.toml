[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tablo-api"
version = "0.1.0"
description = "Python wrapper for the undocumented Tablo 4th Gen API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Trevor Viljoen", email = "trevor.viljoen@gmail.com" }]
keywords = ["tablo", "ota", "dvr", "tv", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/trevor-viljoen/tablo-api"
Repository = "https://github.com/trevor-viljoen/tablo-api"
"Bug Tracker" = "https://github.com/trevor-viljoen/tablo-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["tablo_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
