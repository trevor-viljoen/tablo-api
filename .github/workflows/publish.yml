# .github/workflows/publish.yml
#
# Publishes tablo-api to PyPI automatically when you create a GitHub Release.
#
# SETUP REQUIRED (one-time):
# 1. Go to https://pypi.org/manage/account/publishing/ (pending publisher)
#    Add a Trusted Publisher with these values:
#      Project name:  tablo-api
#      Owner:         trevor-viljoen
#      Repository:    tablo-api
#      Workflow file: publish.yml
#      Environment:   pypi
# 2. GitHub repo already has a "pypi" environment — no secrets needed.
#
# TO RELEASE:
# 1. Bump the version in pyproject.toml
# 2. Commit and push
# 3. GitHub → Releases → Draft a new release → create tag (e.g. v0.1.0) → Publish

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/tablo-api
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
